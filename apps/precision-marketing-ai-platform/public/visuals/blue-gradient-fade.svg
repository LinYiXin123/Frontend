    <g filter="url(#blur)">
      <ellipse cx="960" cy="128" rx="1636" ry="590" fill="#E6F4FF"/>
      <ellipse cx="988" cy="-36" rx="1540" ry="520" fill="#BAE0FF" fill-opacity=".88"/>
      <ellipse cx="960" cy="-156" rx="1350" ry="470" fill="#69B1FF" fill-opacity=".62"/>
      <ellipse cx="960" cy="-286" rx="1120" ry="390" fill="#1677FF" fill-opacity=".38"/>
    </g>
    <rect y="650" width="1920" height="430" fill="url(#fade)"/>
